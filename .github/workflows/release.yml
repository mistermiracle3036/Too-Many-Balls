name: Release

# Fires on every push to main. Reads the version straight out of each
# mod's manifest.json, so nothing here needs updating when a ball is
# added -- only the version-bump-and-push you already do.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shop_events/**"
      - "kanto_balls/**"


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions and enforce lockstep
        id: ver
        run: |
          SE=$(jq -r .version shop_events/manifest.json)
          KB=$(jq -r .version kanto_balls/manifest.json)
          echo "shop_events version: $SE"
          echo "kanto_balls version: $KB"
          if [ "$SE" != "$KB" ]; then
            echo "::error::Version mismatch -- shop_events is $SE, kanto_balls is $KB. This repo shares one release stream: both manifests must carry the SAME version before pushing to main (see each mod's CHANGELOG preamble for why)."
            exit 1
          fi
          echo "version=$SE" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release zips
        if: steps.check.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Flat archives: manifest.json at the root of each zip rather than
          # inside a "<mod>/" folder. LauncherMods.locateRoot accepts either
          # shape and names the install folder from manifest.id regardless,
          # but the community mod index requires files at the archive root.
          # tests/ is dev tooling (kanto_balls/tests/hook_harness.lua) and must
          # NOT ship: the test-build script excludes it, and a public zip that
          # disagreed with the tested one is the exact divergence that put an
          # internal handoff doc inside a pokeball_seals zip in August.
          (cd shop_events && zip -qr "../shop_events-$V.zip" . -x '*.DS_Store' 'tests/*')
          (cd kanto_balls && zip -qr "../kanto_balls-$V.zip" . -x '*.DS_Store' 'tests/*')
          unzip -l "shop_events-$V.zip"
          unzip -l "kanto_balls-$V.zip"

      - name: Build combined release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"

          # Back-ported from the adopted repos' workflow (Apricorn-Farm et
          # al), which had both of these and this one had neither.
          #
          # 1. THE HEADING IS MATCHED ON ITS VERSION TOKEN, not as a regex.
          #    The old form was `awk "/^## $V/..."`, where $V is
          #    interpolated straight into a pattern -- so its dots are
          #    wildcards AND it anchors only at the start. Extracting
          #    "0.4.3" therefore matches "## 0.4.30", and this repo's
          #    CHANGELOG contains both of those headings today. Whichever
          #    came first would win and the release would carry the wrong
          #    version's notes.
          #
          # 2. AN EMPTY BODY IS A HARD FAILURE. Without this a heading that
          #    does not match, or a version whose section is still blank,
          #    publishes a release whose notes are nothing but the install
          #    steps -- silently, with a green tick. That is a live trap
          #    here: `next` carries the NEXT version's heading with no body
          #    under it for most of its life.
          section() {
            awk -v v="$V" '
              /^## / {
                if (found) exit
                h = $0
                gsub(/[][]/, "", h)
                sub(/^##[ \t]*/, "", h)
                split(h, parts, /[ \t]/)
                if (parts[1] == v) { found = 1; next }
              }
              found { print }
            ' "$1"
          }

          # Checked PER MOD, not on the concatenation: this repo ships two
          # mods in lockstep, so a combined check would pass on one mod's
          # section while the other silently contributed nothing.
          for m in shop_events kanto_balls; do
            section "$m/CHANGELOG.md" > "$m-notes.md"
            if ! grep -q '[^[:space:]]' "$m-notes.md"; then
              echo "::error::no CHANGELOG section body for $V in $m/CHANGELOG.md -- refusing to publish empty release notes"
              exit 1
            fi
          done

          {
            echo "## Shop Events $V"
            cat shop_events-notes.md
            echo ""
            echo "## Too Many Balls $V"
            cat kanto_balls-notes.md
          } > notes.md

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "v$V" \
            "shop_events-$V.zip" \
            "kanto_balls-$V.zip" \
            --title "Too Many Balls $V" \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
